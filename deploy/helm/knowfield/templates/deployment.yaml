apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knowfield.fullname" . }}
  labels: {{- include "knowfield.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate           # media PVC 為 RWO → 不用 RollingUpdate（避免兩 pod 搶掛）
  selector:
    matchLabels:
      {{- include "knowfield.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "knowfield.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
      annotations:
        # 密鑰變更時滾動重啟（讓 Secret 更新生效）
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret | default (printf "%s-env" (include "knowfield.fullname" .)) }}
          env:
            # DB DSN 顯式給（覆蓋 .env 帶入的空值）：指向 chart 內建 PG 或外部 DB
            - name: KNOWFIELD_DATABASE_URL
              value: {{ include "knowfield.databaseUrl" . | quote }}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: media
              mountPath: /data/media
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "knowfield.fullname" . }}-media
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
