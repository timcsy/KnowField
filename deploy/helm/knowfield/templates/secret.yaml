apiVersion: v1
kind: Secret
metadata:
  name: {{ include "knowfield.fullname" . }}-env
  labels: {{- include "knowfield.labels" . | nindent 4 }}
type: Opaque
stringData:
  KNOWFIELD_DATABASE_URL: {{ include "knowfield.databaseUrl" . | quote }}
  # 單人 Google 登入門鎖（allowlist＋憑證都設才啟用）
  KNOWFIELD_AUTH_ALLOWLIST: {{ .Values.auth.allowlist | quote }}
  KNOWFIELD_GOOGLE_CLIENT_ID: {{ .Values.auth.googleClientId | quote }}
  KNOWFIELD_GOOGLE_CLIENT_SECRET: {{ .Values.auth.googleClientSecret | quote }}
  KNOWFIELD_SESSION_SECRET: {{ .Values.auth.sessionSecret | quote }}
  {{- if .Values.auth.disabled }}
  KNOWFIELD_AUTH_DISABLED: "1"
  {{- end }}
  # LLM gateway（空=離線 stub）
  KNOWFIELD_API_BASE: {{ .Values.backend.apiBase | quote }}
  KNOWFIELD_API_KEY: {{ .Values.backend.apiKey | quote }}
  KNOWFIELD_CHAT_MODEL: {{ .Values.backend.chatModel | quote }}
  KNOWFIELD_EMBED_MODEL: {{ .Values.backend.embedModel | quote }}
  KNOWFIELD_OCR_MODEL: {{ .Values.backend.ocrModel | quote }}
