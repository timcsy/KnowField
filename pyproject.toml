[project]
name = "learnnews"
version = "0.1.0"
description = "LearnNews — AI 新聞/論文的每日分診工具（推模式 MVP）"
requires-python = ">=3.12"
# 核心與真實後端皆以標準函式庫實作，零必要外部相依（YAGNI，離線可測）。
# 真實 embedding／摘要走使用者的 OpenAI 格式 API（stdlib urllib），不需額外套件。
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
learnnews = "learnnews.cli.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
