[project]
name = "knowfield"
version = "0.1.0"
description = "KnowField — AI 新聞/論文的每日分診工具（推模式 MVP）"
requires-python = ">=3.12"
# 核心演算法（chunk/ingest/distill/rag）仍以標準函式庫實作、零外部相依（YAGNI，離線可測）。
# 真實 embedding／摘要走使用者的 OpenAI 格式 API（stdlib urllib）。
# spec 034：資料層（repository）改用 Postgres → 需 psycopg（憲章 IV：有明確需求＋計畫說明必要性；
# 放鬆的是 spec 級「核心含 repository 零相依」慣例，非憲章條文，見 history/084）。
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
# httpx：FastAPI TestClient 需要；testcontainers：整合測試起容器化 PG（核心測試不需，守零安裝離線）
dev = ["pytest>=8", "httpx>=0.27", "testcontainers[postgres]>=4"]
# web 介面（階段 6）——框架相依只在此層，核心仍零相依
# spec 035：單人 Google 登入門鎖 → authlib（OIDC 流程）＋itsdangerous（SessionMiddleware 簽章）
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.12",
       "authlib>=1.6", "itsdangerous>=2.2", "httpx>=0.27"]   # httpx：Authlib OAuth client 執行期需要

[project.scripts]
knowfield = "knowfield.cli.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
