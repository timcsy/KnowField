{# 一則消化的卡片，供 digest.html 與 pull.html 共用（DaisyUI card） #}
<div class="card bg-base-100 shadow-sm hover:shadow-md transition-shadow mb-5">
  {% if e.figure %}
    <figure class="px-4 pt-4">
      <img src="{{ e.figure.url }}" loading="lazy" alt="{{ e.figure.label }}"
           class="rounded-xl w-full max-h-72 object-cover">
    </figure>
  {% endif %}
  <div class="card-body gap-2 p-5">
    <h2 class="card-title text-lg leading-snug">
      <a href="{{ e.source_url }}" target="_blank" rel="noopener" class="link link-hover">{{ e.headline }}</a>
    </h2>
    <div class="flex flex-wrap items-center gap-2">
      {% if e.figure %}
        <span class="badge badge-sm {% if e.figure.is_ai %}badge-warning{% else %}badge-ghost{% endif %}">{{ e.figure.label }}</span>
      {% endif %}
      {% if e.show_original %}
        <span class="text-xs opacity-50">原標題：{{ e.original_title }}</span>
      {% endif %}
    </div>
    {% for p in e.paragraphs %}
      <p class="leading-relaxed text-[15px]">{{ p }}</p>
    {% endfor %}
    <div class="card-actions justify-end pt-1">
      <a href="{{ e.source_url }}" target="_blank" rel="noopener"
         class="btn btn-sm btn-outline btn-primary">一鍵直達原文 →</a>
    </div>
  </div>
</div>
