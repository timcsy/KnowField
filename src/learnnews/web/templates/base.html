<!DOCTYPE html>
<html lang="zh-Hant" data-theme="nord">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LearnNews{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']],
             displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    .answer-md p { margin: .55rem 0; }
    .answer-md ul { list-style: disc; margin: .4rem 0 .4rem 1.5rem; }
    .answer-md ol { list-style: decimal; margin: .4rem 0 .4rem 1.5rem; }
    .answer-md li { margin: .2rem 0; }
    .answer-md strong { font-weight: 600; }
    .answer-md h1, .answer-md h2, .answer-md h3 { font-weight: 700; margin: .7rem 0 .3rem; }
    .answer-md code { background: rgba(0,0,0,.06); padding: 0 .25rem; border-radius: 3px; }
    .answer-md a { text-decoration: underline; }
    /* 維基式引用上標連結 */
    .answer-md .cite { font-size: .72em; vertical-align: super; text-decoration: none;
                       color: #2563eb; padding: 0 .1em; }
    .answer-md .cite:hover { text-decoration: underline; }
    .src-item { scroll-margin-top: 5rem; transition: background .3s; }
    .src-item:target { background: rgba(37,99,235,.14); border-radius: 5px; }
  </style>
</head>
<body class="min-h-screen bg-base-200 text-base-content">
  <div class="navbar bg-base-100 shadow-sm sticky top-0 z-30">
    <div class="max-w-3xl mx-auto w-full px-3 flex flex-wrap items-center gap-2">
      <a href="/" class="btn btn-ghost text-xl px-2">📰 LearnNews</a>
      <div class="hidden sm:flex">
        <a href="/" class="btn btn-ghost btn-sm">今日匯整</a>
        <a href="/pull" class="btn btn-ghost btn-sm">主題深挖</a>
        <a href="/worth" class="btn btn-ghost btn-sm">值不值得</a>
        <a href="/search" class="btn btn-ghost btn-sm">搜尋</a>
        <a href="/ask" class="btn btn-ghost btn-sm">問答</a>
        <a href="/ingest" class="btn btn-ghost btn-sm">收進</a>
        <a href="/library" class="btn btn-ghost btn-sm">知識庫</a>
        <a href="/roots" class="btn btn-ghost btn-sm">根因</a>
        <a href="/sources" class="btn btn-ghost btn-sm">來源</a>
        <a href="/interests" class="btn btn-ghost btn-sm">興趣</a>
      </div>
      <form action="/pull" method="get" class="join ml-auto">
        <input name="topic" value="{{ topic|default('') }}" placeholder="輸入主題即時拉…"
               class="input input-bordered input-sm join-item w-40 sm:w-56">
        <button class="btn btn-primary btn-sm join-item">拉</button>
      </form>
    </div>
  </div>

  <main class="max-w-3xl mx-auto px-3 sm:px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer footer-center p-6 text-base-content/50 text-xs">
    <aside><p>LearnNews — 消化到底，隨時可回溯。</p></aside>
  </footer>
</body>
</html>
