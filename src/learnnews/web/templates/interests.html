{% extends "base.html" %}
{% block title %}興趣主題 — LearnNews{% endblock %}
{% block content %}
  <h1 class="text-2xl font-bold mb-5">興趣主題</h1>

  <form action="/interests/add" method="post" class="join w-full mb-5">
    <input name="topic" placeholder="新增一個主題…" class="input input-bordered join-item flex-1">
    <button class="btn btn-primary join-item">新增</button>
  </form>

  {% if topics %}
    <div class="card bg-base-100 shadow-sm">
      <ul class="divide-y divide-base-200">
        {% for t in topics %}
          <li class="flex items-center justify-between px-5 py-3">
            <span class="font-medium">{{ t }}</span>
            <form action="/interests/remove" method="post">
              <input type="hidden" name="topic" value="{{ t }}">
              <button class="btn btn-ghost btn-xs text-error">刪除</button>
            </form>
          </li>
        {% endfor %}
      </ul>
    </div>
  {% else %}
    <div class="alert">
      <span class="opacity-70">尚未設定任何興趣主題（匯整會採用預設清單）。</span>
    </div>
  {% endif %}
{% endblock %}
