{% extends "base.html" %}
{% block title %}{{ topic or "主題深挖" }} — LearnNews{% endblock %}
{% block content %}
  {% if topic %}
    <div class="flex items-center gap-2 mb-4">
      <h1 class="text-2xl font-bold">🔎 主題深挖</h1>
      <span class="badge badge-primary badge-outline">{{ topic }}</span>
    </div>

    <div id="progress" class="alert bg-base-100 mb-4">
      <span class="loading loading-dots loading-md text-primary"></span>
      <span id="progress-text">正在準備…</span>
    </div>

    <div id="results"></div>

    <script>
      (function () {
        var topic = {{ topic | tojson }};
        var results = document.getElementById('results');
        var progress = document.getElementById('progress');
        var ptext = document.getElementById('progress-text');
        var es = new EventSource('/pull/stream?topic=' + encodeURIComponent(topic));
        es.onmessage = function (e) {
          var d = JSON.parse(e.data);
          if (d.type === 'stage') {
            ptext.textContent = d.text;
          } else if (d.type === 'card') {
            results.insertAdjacentHTML('beforeend', d.html);
            if (d.progress) ptext.textContent = '消化中 ' + d.progress + '（寫好即顯示）';
          } else if (d.type === 'empty') {
            progress.className = 'alert mb-4';
            progress.innerHTML = '查無與「' + topic + '」相關的材料。';
            es.close();
          } else if (d.type === 'error') {
            progress.className = 'alert alert-error mb-4';
            progress.innerHTML = '⚠ 消化後端暫時不可用，可稍後重試或用離線模式。';
            es.close();
          } else if (d.type === 'done') {
            progress.remove();
            es.close();
          }
        };
        es.onerror = function () { es.close(); };
      })();
    </script>
  {% else %}
    <div class="hero bg-base-100 rounded-2xl py-16">
      <div class="hero-content text-center">
        <div>
          <p class="text-lg font-semibold mb-1">主題深挖</p>
          <p class="text-sm opacity-60">在上方輸入一個主題，即時拉取跨來源的相關材料（散文＋一鍵原文，結果邊算邊顯示）。</p>
        </div>
      </div>
    </div>
  {% endif %}
{% endblock %}
