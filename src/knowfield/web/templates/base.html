<!DOCTYPE html>
<html lang="zh-Hant" data-theme="cupcake">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>(function(){try{var t=localStorage.getItem('kf-theme');if(t==='cupcake'||t==='dim'){document.documentElement.setAttribute('data-theme',t);}else if(t){localStorage.removeItem('kf-theme');}}catch(e){}})();</script>
  <title>{% block title %}KnowField{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']],
             displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    .answer-md p { margin: .55rem 0; }
    .answer-md ul { list-style: disc; margin: .4rem 0 .4rem 1.5rem; }
    .answer-md ol { list-style: decimal; margin: .4rem 0 .4rem 1.5rem; }
    .answer-md li { margin: .2rem 0; }
    .answer-md strong { font-weight: 600; }
    .answer-md h1, .answer-md h2, .answer-md h3 { font-weight: 700; margin: .7rem 0 .3rem; }
    .answer-md code { background: rgba(0,0,0,.06); padding: 0 .25rem; border-radius: 3px; }
    .answer-md a { text-decoration: underline; }
    /* markdown 表格：有框、有內距、寬表可橫向捲動（不撐破版面） */
    .answer-md table { border-collapse: collapse; margin: .7rem 0; display: block;
                       overflow-x: auto; max-width: 100%; font-size: .93em; }
    .answer-md th, .answer-md td { border: 1px solid rgba(0,0,0,.16);
                       padding: .35rem .65rem; text-align: left; vertical-align: top; }
    .answer-md th { background: rgba(0,0,0,.05); font-weight: 600; white-space: nowrap; }
    .answer-md tbody tr:nth-child(even) td { background: rgba(0,0,0,.025); }
    /* 維基式引用上標連結 */
    .answer-md .cite { font-size: .72em; vertical-align: super; text-decoration: none;
                       color: inherit; opacity: .5; padding: 0 .1em; }
    .answer-md .cite:hover { text-decoration: underline; opacity: .8; }
    .src-item { scroll-margin-top: 5rem; transition: background .3s; }
    .src-item:target { background: rgba(0,0,0,.06); border-radius: 5px; }
    /* 可複製的數學式（複製即回傳含 $ / $$ 的 LaTeX 原始碼） */
    .mathcopy { cursor: copy; border-radius: 3px; transition: background .3s; }
    .mathcopy:hover { background: rgba(0,0,0,.05); }
    .mathcopy-block { display: block; }
    /* 側欄 active：中性灰、不上主色（貼 ChatGPT/Claude 的低彩感） */
    .menu li > a.active, .menu li > a.active:hover, .menu li > a:active {
      background-color: hsl(var(--b3)) !important; color: hsl(var(--bc)) !important; font-weight: 600; }
    /* 自訂暖色低彩調色盤（貼 Claude 的舒服感）：覆蓋 cupcake 的 DaisyUI 變數 */
    [data-theme="cupcake"] {
      --b1: 44 40% 98%;   /* 紙面：卡片/側欄，暖白（提亮，跟背景拉開） */
      --b2: 40 30% 90%;   /* 頁背景，暖奶油（壓深，讓卡片更跳） */
      --b3: 39 26% 86%;   /* 使用者氣泡/hover，暖灰 */
      --bc: 30 14% 22%;   /* 文字，暖深灰（非純黑，柔和） */
      --n:  28 16% 26%;   /* neutral＝送出鈕，暖深 */
      --nc: 44 36% 96%;
      --p:  16 48% 52%;   /* 主色（少用）＝沉穩陶土，非藍 */
      --pc: 44 36% 97%;
      --in: 205 30% 45%; --su: 145 30% 40%; --wa: 40 60% 48%; --er: 8 55% 52%;  /* 資訊/成功/警示/錯誤都降飽和 */
    }
    /* 邊框極淡（跟氣泡脫鉤）：所有結構線只用文字色的 ~9% 透明，柔和不跳 */
    .border-base-300 { border-color: hsl(var(--bc) / 0.09) !important; }
    .border-base-200 { border-color: hsl(var(--bc) / 0.06) !important; }
    /* 柔和暖陰影：卡片浮起來、不用邊框（比 DaisyUI 冷灰陰影暖、明顯一點） */
    .kf-card { box-shadow: 0 1px 2px hsl(var(--bc) / .07), 0 3px 8px hsl(var(--bc) / .08); }
    /* 全域把既有卡片的冷灰陰影換暖、統一手感 */
    .shadow-sm { box-shadow: 0 1px 2px hsl(var(--bc) / .06), 0 2px 6px hsl(var(--bc) / .07) !important; }
  </style>
</head>
<body class="bg-base-200 text-base-content">
  {% set path = request.url.path if request else '' %}
  <div class="drawer lg:drawer-open">
    <input id="nav-drawer" type="checkbox" class="drawer-toggle" />

    <div class="drawer-content flex flex-col min-h-screen">
      <!-- 手機頂列（桌機隱藏，桌機走左側常駐欄） -->
      <header class="lg:hidden sticky top-0 z-30 flex items-center gap-2 h-14 px-3 bg-base-100/95 backdrop-blur">
        <label for="nav-drawer" class="btn btn-ghost btn-sm btn-square" aria-label="開啟選單">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </label>
        <a href="/chat" class="font-semibold">🧠 KnowField</a>
      </header>

      <main class="flex-1 flex flex-col w-full max-w-4xl mx-auto px-5 sm:px-8 py-6">
        {% block content %}{% endblock %}
      </main>
    </div>

    <!-- 左側欄：桌機常駐、手機抽屜（市場慣例殼） -->
    <div class="drawer-side z-40">
      <label for="nav-drawer" class="drawer-overlay" aria-label="關閉選單"></label>
      <aside class="w-64 min-h-full bg-base-100 flex flex-col">
        <a href="/chat" class="flex items-center gap-2 h-14 px-4 text-lg font-bold">
          <span>🧠</span><span>KnowField</span>
        </a>
        <ul class="menu gap-0.5 px-2 py-3 flex-1 text-[15px]">
          <li><a href="/chat"          class="{{ 'active' if path.startswith('/chat') else '' }}">💬 跟知識聊</a></li>
          <li><a href="/roots"         class="{{ 'active' if path.startswith('/roots') else '' }}">💡 核心理解</a></li>
          <li><a href="/library"       class="{{ 'active' if path.startswith('/library') or path.startswith('/source') else '' }}">📚 知識庫</a></li>
          <li><a href="/ingest"        class="{{ 'active' if path.startswith('/ingest') else '' }}">➕ 收進</a></li>
          <li><a href="/conversations" class="{{ 'active' if path.startswith('/conversation') else '' }}">🗂 對話存檔</a></li>
        </ul>
        <div class="p-3">
          <button type="button" onclick="toggleTheme()" class="btn btn-ghost btn-sm w-full justify-start gap-2">
            <span id="theme-icon">🌙</span><span id="theme-label">深色</span>
          </button>
          <p class="text-[11px] text-base-content/40 px-1 mt-2 leading-relaxed">消化到底，隨時可回溯。</p>
        </div>
      </aside>
    </div>
  </div>

  <div id="toast" class="toast toast-end z-50" style="display:none"></div>

  <script>
    // 淺/深主題切換（corporate ↔ dim），localStorage 記住；FOUC 由 <head> 內聯腳本先套。
    function toggleTheme(){
      var d = document.documentElement, next = d.getAttribute('data-theme') === 'dim' ? 'cupcake' : 'dim';
      d.setAttribute('data-theme', next);
      try { localStorage.setItem('kf-theme', next); } catch(e){}
      _updTheme();
    }
    function _updTheme(){
      var dark = document.documentElement.getAttribute('data-theme') === 'dim';
      var i = document.getElementById('theme-icon'), l = document.getElementById('theme-label');
      if (i) i.textContent = dark ? '☀️' : '🌙';
      if (l) l.textContent = dark ? '淺色' : '深色';
    }
    document.addEventListener('DOMContentLoaded', _updTheme);
  </script>

  <script>
    // 共用：向匯出端點取純文字 → 複製到剪貼簿 → toast 提示（spec 024，複製給 NotebookLM）。
    // opts: { method:'GET'|'POST', body:FormData|null, empty:'（無佐證網址）' }
    window.copyExport = async function (url, opts) {
      opts = opts || {};
      try {
        var resp = await fetch(url, { method: opts.method || 'GET', body: opts.body || null });
        if (!resp.ok) { window.showToast('匯出失敗：' + resp.status, true); return; }
        var text = await resp.text();
        if (!text.trim()) { window.showToast(opts.empty || '沒有可複製的內容'); return; }
        if (!navigator.clipboard) { window.showToast('這個瀏覽器不允許自動複製', true); return; }
        await navigator.clipboard.writeText(text);
        window.showToast('已複製，可貼進 NotebookLM');
      } catch (err) {
        window.showToast('複製失敗，請再試一次', true);
      }
    };
    window.showToast = function (msg, isErr) {
      var box = document.getElementById('toast');
      if (!box) return;
      box.innerHTML = '<div class="alert ' + (isErr ? 'alert-error' : 'alert-success') +
        '"><span>' + msg + '</span></div>';
      box.style.display = '';
      clearTimeout(window._toastT);
      window._toastT = setTimeout(function () { box.style.display = 'none'; }, 2200);
    };
  </script>

  <script>
    // 數學式可複製：點一下複製其 LaTeX（含 $ / $$）；選取後 Ctrl+C 也回傳 LaTeX 原始碼。
    document.addEventListener('click', function (e) {
      var m = e.target.closest && e.target.closest('.mathcopy');
      if (!m || !m.getAttribute('data-tex')) return;
      var tex = m.getAttribute('data-tex');
      if (navigator.clipboard) navigator.clipboard.writeText(tex);
      var prev = m.style.background; m.style.background = 'rgba(34,197,94,.30)';
      setTimeout(function () { m.style.background = prev; }, 450);
    });
    // 複製一整段（可含多個數學片段）：把選取範圍內每個 .mathcopy 還原成其 LaTeX 原始碼
    // （含 $ / $$ 分隔符），其餘文字照舊 → 貼出來就是可再編輯的原始碼，不是 MathJax 渲染物。
    function mathOf(n) {
      if (!n) return null;
      var el = n.nodeType === 1 ? n : n.parentElement;
      return el && el.closest ? el.closest('.mathcopy') : null;
    }
    document.addEventListener('copy', function (e) {
      var sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || sel.isCollapsed || !e.clipboardData) return;
      var range = sel.getRangeAt(0);
      var frag = range.cloneContents();
      var maths = frag.querySelectorAll ? frag.querySelectorAll('.mathcopy') : [];
      if (!maths.length) {
        // 選取整個落在單一數學元素內（cloneContents 不含該祖先）→ 直接回傳其 LaTeX
        var a = mathOf(sel.anchorNode);
        if (a && a === mathOf(sel.focusNode)) {
          e.clipboardData.setData('text/plain', a.getAttribute('data-tex'));
          e.preventDefault();
        }
        return;   // 純文字、無數學 → 讓瀏覽器預設處理
      }
      // 混合選取：逐一把 .mathcopy 換成其 data-tex（block 前後補換行，較像 markdown）
      maths.forEach(function (m) {
        var tex = m.getAttribute('data-tex') || '';
        var block = m.classList && m.classList.contains('mathcopy-block');
        m.replaceWith(document.createTextNode(block ? ('\n' + tex + '\n') : tex));
      });
      e.clipboardData.setData('text/plain', frag.textContent);
      e.preventDefault();
    });
  </script>
</body>
</html>
